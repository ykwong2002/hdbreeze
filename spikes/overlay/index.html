<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>HDBreeze spike B: overlay registration</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #map { position: fixed; inset: 0; }
      #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; padding: 6px 8px; font: 11px/1.4 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.65); color: #eee; border-radius: 8px; white-space: pre; pointer-events: none; max-width: 70vw; }
      #btns { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      button { font: 13px/1 inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #555; background: #262521; color: #eee; }
      button.on { background: #2a9d9f; border-color: #2a9d9f; }
      .corner { width: 14px; height: 14px; border: 2px solid #000; background: rgba(255,255,0,.85); border-radius: 50%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud">…</div>
    <div id="btns">
      <button id="bCustom" class="on">Custom layer</button>
      <button id="bCanvas">Canvas source</button>
      <button id="bRotate">Rotate 90°</button>
      <button id="bSpin">Spin</button>
      <button id="bPitch">Pitch 0/60</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
