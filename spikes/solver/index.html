<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>HDBreeze spike A: solver comparison</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      html, body { margin: 0; height: 100%; background: #14130f; color: #eee; }
      #wrap { display: flex; flex-direction: column; height: 100%; }
      #stage { position: relative; flex: 0 0 auto; width: 100vw; height: 100vw; max-height: 60vh; max-width: 60vh; margin: 0 auto; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
      #arrow { position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; font-size: 20px; pointer-events: none; }
      #hud { position: absolute; top: 8px; right: 8px; padding: 4px 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.55); border-radius: 8px; white-space: pre; }
      #panel { flex: 1 1 auto; overflow: auto; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); font-size: 13px; }
      .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; align-items: center; margin: 4px 0; }
      .row input[type=range] { width: 100%; }
      .row output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
      .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
      button, select { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #555; background: #262521; color: #eee; }
      button.on { background: #2a9d9f; border-color: #2a9d9f; color: #fff; }
      small { color: #aaa; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="arrow">➜</div>
        <div id="hud">…</div>
      </div>
      <div id="panel">
        <div class="btns">
          <button id="bStable" class="on">Stable fluids</button>
          <button id="bLbm">Lattice Boltzmann</button>
          <button id="bReset">Reset</button>
          <button id="bView">Show: heat</button>
          <button id="bPause">Pause</button>
        </div>
        <div id="controls"></div>
        <p><small>Dark = solid block, hatched = void deck (porous). Wind arrow top-left. Spike A criteria: ≥30 fps, no NaN in 5 min, slab wake longer than point-block wake, breeze through the void deck, reconverges &lt;3 s after turning the wind.</small></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
