<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>HDBreeze</title>
    <meta
      name="description"
      content="HDBreeze is a fan-made educational game: plan a liveable HDB precinct on a real plot, house thousands and keep the streets breathable in Singapore's heat. Not affiliated with or endorsed by HDB or URA."
    />
    <meta name="theme-color" content="#f4f2ed" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HDBreeze" />
    <meta
      property="og:description"
      content="Plan a liveable HDB precinct: house thousands on a real plot and keep the streets breathable. A fan-made educational game, not affiliated with HDB or URA."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Map of Singapore"></div>

    <header class="brand">
      <h1>HDBreeze</h1>
      <p>Fan-made toy. Not affiliated with HDB or URA.</p>
    </header>

    <div id="status" class="status" hidden></div>
    <div id="ui"></div>


    <div id="unsupported" class="unsupported" hidden>
      <h2>This browser can't run HDBreeze</h2>
      <p>
        HDBreeze needs WebGL2, which this browser or in-app view has turned off. Open the link in Chrome,
        Safari or Firefox and try again.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
